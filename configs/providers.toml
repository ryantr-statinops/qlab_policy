# Provider presets. Each table shares the same schema.
# CLI flag > preset > [llm] in policy.toml.

[lmstudio]
base_url = "http://localhost:1234/v1"
# empty model + auto_detect = use the model currently loaded in LM Studio
model = ""
api_key_env = ""
auto_detect = true
timeout_sec = 60

[ollama]
base_url = "http://localhost:11434/v1"
model = "qwen3:4b"
api_key_env = ""
auto_detect = false
timeout_sec = 60

[vllm]
base_url = "http://localhost:8000/v1"
model = ""
api_key_env = ""
auto_detect = false
timeout_sec = 60

[llamacpp]
base_url = "http://localhost:8080/v1"
model = ""
api_key_env = ""
auto_detect = false
timeout_sec = 60

[openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-4b-instruct"
api_key_env = "OPENROUTER_API_KEY"
auto_detect = false
timeout_sec = 90
[openrouter.extra_headers]
HTTP-Referer = "https://github.com/ryantr-statinops/qlab_policy"
X-Title = "qlab_rl"

[openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
auto_detect = false
timeout_sec = 90

[custom]
# fill in for any other OpenAI-compatible endpoint (Together, Fireworks, Groq, ...)
base_url = ""
model = ""
api_key_env = ""
auto_detect = false
timeout_sec = 90
