# Provider presets. Each table shares the same schema.
# CLI flag > preset > [llm] in policy.toml.

[lmstudio]
base_url = "http://localhost:1234/v1"
# empty model + auto_detect = use the model currently loaded in LM Studio
model = ""
api_key_env = ""
auto_detect = true
timeout_sec = 60

[ollama]
base_url = "http://localhost:11434/v1"
model = "qwen3:4b"
api_key_env = ""
auto_detect = false
timeout_sec = 60

[vllm]
base_url = "http://localhost:8000/v1"
model = ""
api_key_env = ""
auto_detect = false
timeout_sec = 60

[llamacpp]
base_url = "http://localhost:8080/v1"
model = ""
api_key_env = ""
auto_detect = false
timeout_sec = 60
