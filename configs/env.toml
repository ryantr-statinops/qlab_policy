# Trading environment config

[env]
# commission + slippage in basis points, charged on traded notional
fee_bps = 10.0
# risk aversion lambda: reward = net_return - lambda * vol20 * |exposure|
lambda_risk = 0.5
# bars needed before the first decision (must exceed max lookback)
warmup = 21
# annualisation factor
trading_days_per_year = 252
# how liquidation behaves at the end of a segment: true = forced flat
liquidate_at_end = true

[split]
# chronological 60/20/20 split by bar count.
# train is first 60%, validation next 20%, test last 20%.
train = 0.60
val = 0.20
test = 0.20

[state]
# lookback windows (in bars) used to build the observation vector
ret_windows = [1, 5, 20]
vol_window = 20
drawdown_window = 20